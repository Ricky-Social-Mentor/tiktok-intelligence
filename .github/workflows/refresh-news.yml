name: Refresh TikTok news
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_news.py"
      - "tests/**"
      - ".github/workflows/refresh-news.yml"
permissions:
  contents: write
concurrency:
  group: refresh-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test news relevance filters
        run: python3 -m unittest discover -s tests -v
      - name: Collect public RSS feeds
        run: python3 scripts/refresh_news.py
      - name: Commit feed when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news feed changes to commit."
          else
            git commit -m "Refresh TikTok news feed"
            # Rebase onto any concurrent repository update before pushing the generated feed.
            git pull --rebase origin main
            git push
          fi
