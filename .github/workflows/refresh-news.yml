name: Refresh TikTok news
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_news.py"
      - "tests/**"
      - ".github/workflows/refresh-news.yml"
permissions:
  contents: write
concurrency:
  group: refresh-news
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test news relevance filters
        run: python3 -m unittest discover -s tests -v
      - name: Refresh and safely push feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rigenera sempre partendo dalla versione più recente di main.
          # Se un altro aggiornamento arriva prima del push, riprova senza rebase
          # del file generato, evitando conflitti testuali in news.json.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/refresh_news.py
            git add news.json

            if git diff --cached --quiet; then
              echo "No news feed changes to commit."
              exit 0
            fi

            git commit -m "Refresh TikTok news feed"
            if git push origin HEAD:main; then
              echo "Feed updated successfully."
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying from latest main."
          done

          echo "Could not publish the feed after 3 attempts." >&2
          exit 1
